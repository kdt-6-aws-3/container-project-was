# EKS 전용: mysql 프로파일 위에 덮어쓴다 (SPRING_PROFILES_ACTIVE=mysql,eks)
# WAS -> RDS Proxy 구간은 IAM 인증. 비밀번호 대신 IRSA 역할로 15분짜리 토큰을 만들어 접속한다.
# DB 비밀번호는 Secrets Manager에 있고 RDS Proxy만 읽는다.
spring.datasource.driver-class-name=software.amazon.jdbc.Driver
spring.datasource.url=jdbc:aws-wrapper:mysql://${DB_PROXY_ENDPOINT}:3306/petclinic?wrapperPlugins=iam&sslMode=VERIFY_IDENTITY&iamRegion=${AWS_REGION:ap-northeast-2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:petclinic_app}
spring.datasource.password=
# 토큰은 새 커넥션을 맺을 때만 쓰인다. max-lifetime(5분)은 mysql 프로파일 값을 그대로 쓴다.
