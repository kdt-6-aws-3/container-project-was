spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/petclinic?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:petclinic_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=10000
# 샘플 데이터는 자동으로 넣지 않는다. 빈 DB에 처음 넣을 때만 SPRING_SQL_INIT_MODE=always로 한 번 기동
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:db/mysql/data.sql
# 엔티티와 비교해 없는 테이블·컬럼만 추가한다 (기존 데이터 유지)
spring.jpa.hibernate.ddl-auto=update
