# 테이블은 엔티티 클래스를 보고 Hibernate가 만든다. data.sql은 테이블 생성 뒤에 실행된다.
spring.sql.init.data-locations=classpath:db/h2/data.sql
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# 검증 기본 메시지를 항상 한국어로
spring.web.locale=ko
spring.web.locale-resolver=fixed

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

server.tomcat.keep-alive-timeout=65s
server.tomcat.threads.max=50
spring.datasource.hikari.connection-timeout=5000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
